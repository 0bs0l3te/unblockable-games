    <meta charset="UTF-8" />
    <title>Color Palette Generator</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: black;
      }
      .container {
        text-align: center;
        padding: 20px;
        background: rgb(15, 15, 15);
        max-width: 400px;
        margin: 20px auto;
        color: white;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgb(57, 57, 57);
      }
      input[type="color"] {
        width: 80px;
        height: 40px;
        border: none;
        cursor: pointer;
        background: none;
      }
      select {
        padding: 8px 12px;
        margin-top: 10px;
        font-size: 14px;
        border: none;
        border-radius: 15px;
        background-color: black;
        color: white;
      }
      .palette {
        display: flex;
        width: 100vw;
        height: 50vh;
        margin-top: 20px;
        gap: 10px;
      }
      .color-block {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: #fff;
        font-size: 1.2rem;
        border-radius: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Choose a Color</h2>
      <input type="color" id="colorPicker" value="#3b82f6" />
      <select id="colType">
        <option value="comp">Complementary</option>
        <option value="splitcomp">Split-Complementary</option>
        <option value="anlgs">Analogous</option>
        <option value="tri">Triadic</option>
        <option value="tet">Tetradic (Rectangle)</option>
        <option value="sqr">Square</option>
        <option value="mono">Monochromatic</option>
      </select>
    </div>

    <div id="palDis" class="palette"></div>

    <script>
      const colorPicker = document.getElementById("colorPicker");
      const colType = document.getElementById("colType");
      const paletteDiv = document.getElementById("palDis");

      function hexToHSL(hex) {
        let r = parseInt(hex.substring(1, 3), 16) / 255;
        let g = parseInt(hex.substring(3, 5), 16) / 255;
        let b = parseInt(hex.substring(5, 7), 16) / 255;

        let max = Math.max(r, g, b),
          min = Math.min(r, g, b);
        let h,
          s,
          l = (max + min) / 2;

        if (max === min) {
          h = s = 0;
        } else {
          let d = max - min;
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          switch (max) {
            case r:
              h = (g - b) / d + (g < b ? 6 : 0);
              break;
            case g:
              h = (b - r) / d + 2;
              break;
            case b:
              h = (r - g) / d + 4;
              break;
          }
          h /= 6;
        }
        return {
          h: Math.round(h * 360),
          s: Math.round(s * 100),
          l: Math.round(l * 100),
        };
      }

      function hslToHex(h, s, l) {
        h = ((h % 360) + 360) % 360;
        s /= 100;
        l /= 100;

        let c = (1 - Math.abs(2 * l - 1)) * s;
        let x = c * (1 - Math.abs(((h / 60) % 2) - 1));
        let m = l - c / 2;
        let r = 0,
          g = 0,
          b = 0;

        if (0 <= h && h < 60) {
          r = c;
          g = x;
          b = 0;
        } else if (60 <= h && h < 120) {
          r = x;
          g = c;
          b = 0;
        } else if (120 <= h && h < 180) {
          r = 0;
          g = c;
          b = x;
        } else if (180 <= h && h < 240) {
          r = 0;
          g = x;
          b = c;
        } else if (240 <= h && h < 300) {
          r = x;
          g = 0;
          b = c;
        } else if (300 <= h && h < 360) {
          r = c;
          g = 0;
          b = x;
        }

        r = Math.round((r + m) * 255)
          .toString(16)
          .padStart(2, "0");
        g = Math.round((g + m) * 255)
          .toString(16)
          .padStart(2, "0");
        b = Math.round((b + m) * 255)
          .toString(16)
          .padStart(2, "0");

        return `#${r}${g}${b}`;
      }

      function genPalette() {
        const hex = colorPicker.value;
        const type = colType.value;
        const hsl = hexToHSL(hex);
        let colors = [hex];

        if (type === "comp") {
          colors.push(hslToHex(hsl.h + 180, hsl.s, hsl.l));
        } else if (type === "splitcomp") {
          colors.push(hslToHex(hsl.h + 150, hsl.s, hsl.l));
          colors.push(hslToHex(hsl.h + 210, hsl.s, hsl.l));
        } else if (type === "anlgs") {
          colors.unshift(hslToHex(hsl.h - 30, hsl.s, hsl.l));
          colors.push(hslToHex(hsl.h + 30, hsl.s, hsl.l));
        } else if (type === "tri") {
          colors.push(hslToHex(hsl.h + 120, hsl.s, hsl.l));
          colors.push(hslToHex(hsl.h + 240, hsl.s, hsl.l));
        } else if (type === "tet") {
          colors.push(hslToHex(hsl.h + 60, hsl.s, hsl.l));
          colors.push(hslToHex(hsl.h + 180, hsl.s, hsl.l));
          colors.push(hslToHex(hsl.h + 240, hsl.s, hsl.l));
        } else if (type === "sqr") {
          colors.push(hslToHex(hsl.h + 90, hsl.s, hsl.l));
          colors.push(hslToHex(hsl.h + 180, hsl.s, hsl.l));
          colors.push(hslToHex(hsl.h + 270, hsl.s, hsl.l));
        } else if (type === "mono") {
          colors = [
            hslToHex(hsl.h, hsl.s, Math.max(10, hsl.l - 30)),
            hslToHex(hsl.h, hsl.s, Math.max(20, hsl.l - 15)),
            hex,
            hslToHex(hsl.h, hsl.s, Math.min(80, hsl.l + 15)),
            hslToHex(hsl.h, hsl.s, Math.min(90, hsl.l + 30)),
          ];
        }

        renderPalette(colors);
      }

      function renderPalette(colors) {
        paletteDiv.innerHTML = "";
        colors.forEach((color) => {
          const block = document.createElement("div");
          block.className = "color-block";
          block.style.backgroundColor = color;
          block.textContent = color;
          paletteDiv.appendChild(block);
        });
      }

      colorPicker.addEventListener("input", genPalette);
      colType.addEventListener("change", genPalette);

      genPalette();
    </script>
  </body>
</html>
