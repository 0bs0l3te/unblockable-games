<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background: #fafafa radial-gradient(#ececec 2px, transparent 1px) 0
          0/25px 25px;
        margin: 0;
        padding: 10px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      .add-btn {
        width: 30px;
        height: 30px;
        border: none;
        border-radius: 7px;
        background-color: rgb(63, 63, 179);
        color: white;
        font-size: 18px;
        cursor: pointer;
      }

      .windowDiv {
        width: 400px;
        height: 400px;
        overflow: hidden;
        resize: both;
        display: grid;
        grid-template-rows: 24px 1fr;
        position: absolute;
        top: 50px;
        left: 20px;
        background-color: white;
        border: solid 1px rgb(165, 165, 165);
        border-radius: 10px;
        box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.344);
      }
      .header {
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.15);
        box-shadow: 0 3px 50px rgba(0, 0, 0, 0.3);
        cursor: move;
        position: relative;
      }
      .textbox {
        padding: 10px;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        resize: none;
        border: none;
        background: none;
      }
      .close {
        border-radius: 10px;
        height: 20px;
        width: 20px;
        position: absolute;
        right: 4px;
        top: 2px;
        border: solid 2px rgb(255, 113, 113);
        background-color: red;
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: bold;
      }
      .export {
        border-radius: 10px;
        height: 20px;
        width: 20px;
        position: absolute;
        right: 28px;
        top: 2px;
        border: solid 2px rgb(62, 162, 62);
        background-color: green;
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
      }
      .textbox:focus {
        outline: none;
      }

      h1 {
        display: inline;
      }
    </style>
  </head>
  <body>
    <button class="add-btn" id="addBtn">+</button>
    <h1>notepads</h1>
    <script>
      let windowCount = 0;

      function createWindow() {
        windowCount++;

        const windowDiv = document.createElement("div");
        windowDiv.className = "windowDiv";
        windowDiv.style.top = 40 + (windowCount % 10) * 20 + "px";
        windowDiv.style.left = 20 + (windowCount % 10) * 20 + "px";

        const header = document.createElement("div");
        header.className = "header";

        const exportBtn = document.createElement("button");
        exportBtn.className = "export";
        exportBtn.innerHTML = "&uarr;";

        const closeBtn = document.createElement("button");
        closeBtn.className = "close";
        closeBtn.textContent = "X";

        const textbox = document.createElement("textarea");
        textbox.className = "textbox";

        header.appendChild(exportBtn);
        header.appendChild(closeBtn);

        windowDiv.appendChild(header);
        windowDiv.appendChild(textbox);

        document.body.appendChild(windowDiv);

        dragElement(windowDiv, header);

        closeBtn.addEventListener("click", () => {
          windowDiv.remove();
        });

        exportBtn.addEventListener("click", () => {
          const text = textbox.value;
          const blob = new Blob([text], { type: "text/plain" });
          const anchor = document.createElement("a");
          anchor.download = `window-content-${Date.now()}.txt`;
          anchor.href = window.URL.createObjectURL(blob);
          anchor.target = "_blank";
          anchor.style.display = "none";
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
        });
      }

      document.getElementById("addBtn").addEventListener("click", createWindow);

      createWindow();

      function dragElement(elmnt, header) {
        var pos1 = 0,
          pos2 = 0,
          pos3 = 0,
          pos4 = 0;

        header.onmousedown = dragMouseDown;

        function dragMouseDown(e) {
          const allWindows = document.querySelectorAll(".windowDiv");
          allWindows.forEach((w) => (w.style.zIndex = "1"));
          elmnt.style.zIndex = "10";

          e = e || window.event;
          if (e.target.tagName === "BUTTON") return;

          e.preventDefault();
          pos3 = e.clientX;
          pos4 = e.clientY;
          document.onmouseup = closeDragElement;
          document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
          e = e || window.event;
          e.preventDefault();
          pos1 = pos3 - e.clientX;
          pos2 = pos4 - e.clientY;
          pos3 = e.clientX;
          pos4 = e.clientY;
          elmnt.style.top = elmnt.offsetTop - pos2 + "px";
          elmnt.style.left = elmnt.offsetLeft - pos1 + "px";
        }

        function closeDragElement() {
          document.onmouseup = null;
          document.onmousemove = null;
        }
      }
    </script>
  </body>
</html>
