
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Access</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            color: #222;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 360px;
            background: white;
            padding: 32px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
        }

        h1 {
            font-size: 23px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .description {
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 26px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 11px;
            border-radius: 5px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.info {
            display: block;
            background: #f0f0f0;
            color: #333;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #b00020;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Request Access</h1>

        <p class="description">
            This website is private. Click below to
            generate a password request. The owner will
            receive your generated password.
        </p>

        <button type="button" id="generateButton">
            Generate Password
        </button>

        <div class="message" id="message"></div>

        <div class="footer">
            Authorized users only
        </div>
    </main>

    <script>
        const button = document.getElementById("generateButton");
        const message = document.getElementById("message");

        button.addEventListener("click", async () => {
            button.disabled = true;
            button.textContent = "Generating...";
            message.className = "message";
            message.textContent = "";

            try {
                const response = await fetch(
                    "https://access-system.maximusthekat.workers.dev/api/generate",
                    {
                        method: "POST"
                    }
                );

                if (!response.ok) {
                    throw new Error("Request failed");
                }

                message.textContent =
                    "Your password has been generated and sent to the owner. Please wait for them to give you your password.";

                message.className = "message info";

            } catch (error) {
                message.textContent =
                    "Something went wrong. Please try again later.";

                message.className = "message error";
            }

            button.disabled = false;
            button.textContent = "Generate Password";
        });
    </script>
</body>
</html>
