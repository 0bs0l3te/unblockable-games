<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Access</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            color: #222;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 360px;
            background: white;
            padding: 32px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
        }

        h1 {
            font-size: 23px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .description {
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 26px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 14px;
            outline: none;
        }

        input:focus {
            border-color: #555;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 11px;
            border-radius: 5px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.info {
            display: block;
            background: #f0f0f0;
            color: #333;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #b00020;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Request Access</h1>

        <p class="description">
            This website is private. Enter your email address
            to request access. You'll receive an email if your
            account is approved.
        </p>

        <form id="accessForm">
            <label for="email">Email address</label>

            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <button type="submit" id="submitButton">
                Request Access
            </button>
        </form>

        <div class="message" id="message"></div>

        <div class="footer">
            Authorized users only
        </div>
    </main>

    <script>
        const form = document.getElementById("accessForm");
        const button = document.getElementById("submitButton");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();

            button.disabled = true;
            button.textContent = "Sending...";
            message.className = "message";
            message.textContent = "";

            try {
                const response = await fetch("/auth/request-access", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                message.textContent = data.message ||
                    "Your request has been submitted.";
                message.className = "message info";

            } catch (error) {
                message.textContent =
                    "Something went wrong. Please try again later.";
                message.className = "message error";
            }

            button.disabled = false;
            button.textContent = "Request Access";
        });
    </script>
</body>
</html>
