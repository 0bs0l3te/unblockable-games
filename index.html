<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Access</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            color: #222;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 360px;
            background: white;
            padding: 32px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
        }

        h1 {
            font-size: 23px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .description {
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 26px;
        }

        button, input {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            background: #222;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        input {
            border: 1px solid #ddd;
            margin-bottom: 10px;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 11px;
            border-radius: 5px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.info {
            display: block;
            background: #f0f0f0;
            color: #333;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #b00020;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        #passwordSection {
            display: none;
            margin-top: 20px;
        }

        #gameFrame {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
    </style>
</head>

<body>
    <main class="container" id="accessScreen">
        <h1>Request Access</h1>

        <p class="description">
            This website is private. Click below to
            generate a password request. The owner will
            receive your generated password.
        </p>

        <button type="button" id="generateButton">
            Generate Password
        </button>

        <div id="passwordSection">
            <input
                type="password"
                id="passwordInput"
                placeholder="Enter your password"
            >

            <button type="button" id="verifyButton">
                Verify Password
            </button>
        </div>

        <div class="message" id="message"></div>

        <div class="footer">
            Authorized users only
        </div>
    </main>

    <iframe id="gameFrame"></iframe>

    <script>
        const button = document.getElementById("generateButton");
const message = document.getElementById("message");
const passwordSection = document.getElementById("passwordSection");
const passwordInput = document.getElementById("passwordInput");
const verifyButton = document.getElementById("verifyButton");
const accessScreen = document.getElementById("accessScreen");
const gameFrame = document.getElementById("gameFrame");

const API = "https://access-system.maximusthekat.workers.dev";
const GAME_URL = "https://rawcdn.githack.com/0bs0l3te/unblockable-games/877b8aefb401feec393db216fa1d7b23e7d16a99/main.html";

function openGames() {
    localStorage.setItem("enterpass", "true");
    accessScreen.style.display = "none";
    gameFrame.src = GAME_URL;
    gameFrame.style.display = "block";
}

// Check for an existing login when the page opens.
async function checkSession() {
    const token = localStorage.getItem("accessToken");

    if (!token) return;

    try {
        const response = await fetch(`${API}/api/session`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ token })
        });

        const result = await response.json();

        if (response.ok && result.valid) {
            openGames();
        } else {
            localStorage.removeItem("accessToken");
            localStorage.removeItem("enterpass");
        }
    } catch (error) {
        message.textContent = "Couldn't check your saved login. Please try again.";
        message.className = "message error";
    }
}

button.addEventListener("click", async () => {
    button.disabled = true;
    button.textContent = "Generating...";
    message.className = "message";
    message.textContent = "";

    try {
        const response = await fetch(`${API}/api/generate`, {
            method: "POST"
        });

        if (!response.ok) throw new Error("Request failed");

        message.textContent =
            "Your password request has been sent to the owner. Please wait for them to give you your password.";

        message.className = "message info";
        passwordSection.style.display = "block";

    } catch (error) {
        message.textContent = "Something went wrong. Please try again later.";
        message.className = "message error";
    }

    button.disabled = false;
    button.textContent = "Generate Password";
});

verifyButton.addEventListener("click", async () => {
    const password = passwordInput.value.trim();

    if (!password) {
        message.textContent = "Please enter your password.";
        message.className = "message error";
        return;
    }

    verifyButton.disabled = true;
    verifyButton.textContent = "Checking...";

    try {
        const response = await fetch(`${API}/api/verify`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ password })
        });

        const result = await response.json();

        if (!response.ok || !result.token) {
            throw new Error("Invalid password");
        }

        localStorage.setItem("accessToken", result.token);
        openGames();

    } catch (error) {
        message.textContent =
            "Incorrect or expired password. Please try again.";
        message.className = "message error";
    }

    verifyButton.disabled = false;
    verifyButton.textContent = "Verify Password";
});

checkSession();
    </script>
</body>
</html>
