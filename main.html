    rel="stylesheet" />

  <style>
    :root {
      --background: black;
      --gradient-color1: #300835;
      --gradient-color2: rgb(16, 4, 41);
      --card-gradient-color1: rgb(135, 139, 165);
      --card-gradient-color2: rgb(104, 104, 121);
      --card-gradient-hover-color1: rgb(82, 84, 99);
      --card-gradient-hover-color2: rgb(53, 53, 61);
      --border-color1: rgb(38, 7, 69);
      --text-color: white;
      --arrow-color: gray;
      --border-radius-1: 16px;
      --card-border-radius1: 20px;
      --card-border-radius2: 10px;
    }

    body {
      user-select: none;
      font-family: "Signika Negative", sans-serif;
      background-color: var(--background);
      color: var(--text-color);
    }

    #searchbar {
      font-size: 30px;
      background: none;
      border: none;
      outline: none;
      caret-color: var(--text-color);
      color: var(--text-color);
    }

    #settings {
      text-decoration: none;
      font-size: 30px;
      position: absolute;
      right: 20px;
      transition: transform 0.25s;
      color: var(--text-color);
    }

    #settings:hover {
      transform: scale(1.5) rotate(45deg);
    }

    .main-grid-0,
    .main-grid,
    .main-grid-2,
    .main-grid-3,
    .main-grid-4 {
      border: 4px solid var(--border-color1);
      background: linear-gradient(var(--gradient-color1),
          var(--gradient-color2));
      border-radius: var(--border-radius-1);
      padding: 10px;
      height: auto;
      width: calc(100vw - 300px);
      /* short for calculator */
      margin: 0;
      position: relative;
    }

    .title {
      display: inline-block;
      margin: 0;
      font-family: "Blaka Hollow", system-ui;
      font-size: 10vw;
      transition: transform 0.25s ease-out;
      color: white;
      white-space: nowrap;
      transform-origin: left;
      height: fit-content;
      filter: drop-shadow(0px 5px 2px black);
      z-index: 1000;
    }

    .title:hover {
      transform: scale(1.05) rotate(0.3deg);
    }

    .body-div-0,
    .body-div-1,
    .body-div-2,
    .body-div-3,
    .body-div-4 {
      pointer-events: all;
      max-height: 10000000px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .body-div-0.switched,
    .body-div-1.switched,
    .body-div-2.switched,
    .body-div-3.switched,
    .body-div-4.switched {
      display: none;
    }

    .header {
      display: flex;
      overflow: hidden;
      display: fixed;
      position: sticky;
      top: 0;
      margin: 0;
      height: fit-content;
      color: white;
      background: rgba(0, 0, 0, 0.14);
      backdrop-filter: blur(10px);
      border-bottom: solid 1px white;
      z-index: 10000;
    }

    .side-bar {
      position: fixed;
      right: 0;
      bottom: 0;
      width: 235px;
      height: 90%;
      border-left: solid 1px white;
    }

    .authors {
      margin-left: 10px;
      height: fit-content;
      display: inline-block;
      width: 15vw;
      font-size: 2vw;
      transition: transform 0.25s ease-out;
      transform-origin: right;
      filter: drop-shadow(0px 5px 2px black);
    }

    .authors:hover {
      transform: scale(1.05);
    }

    .logo {
      width: 15vw;
      height: 10vw;
      margin: 10px;
      transition: transform 0.25s ease-out;
      filter: drop-shadow(0px 5px 2px black);
      object-fit: contain;
      object-position: center;
    }

    .logo:hover {
      transform: scale(1.05);
    }

    .game-card {
      text-decoration: none;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 15px -7.5px white,
        inset 0px 5px 10px rgba(0, 0, 0, 0.5);

      background: radial-gradient(var(--card-gradient-color1),
          var(--card-gradient-color2));
      border-radius: var(--card-border-radius1) var(--card-border-radius1) var(--card-border-radius2) var(--card-border-radius2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .game-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(var(--card-gradient-hover-color1),
          var(--card-gradient-hover-color2));
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 0;
    }

    .game-card>* {
      position: relative;
      z-index: 1;
    }

    .game-card:hover {
      transform: scale(1.01) translateY(-20px) rotate(1deg);
      box-shadow:
        0 0 10px -7.5px white,
        inset 0px 7.5px 10px rgb(0, 0, 0);
    }

    .game-card:hover::before {
      opacity: 1;
    }

    .game-card>img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      object-position: center;
    }

    .game-card>p {
      font-size: 15px;
      color: var(--text-color);
      text-decoration: none;
      margin: 0;
      text-align: center;
    }

    h2::after {
      content: "⏶";
      display: inline-block;
      padding-left: 25px;
      font-size: 50px;
      color: var(--arrow-color);
      vertical-align: -9px;
      transition: transform 0.2s cubic-bezier(0.97, -0.08, 0.07, 1.04);
    }

    h2 {
      cursor: default;
    }

    .switched {
      opacity: 0%;
      max-height: 0px;
      pointer-events: none;
    }

    h2.active::after {
      content: "⏶";
      display: inline-block;
      padding-left: 25px;
      font-size: 50px;
      color: var(--arrow-color);
      vertical-align: -9px;
      transform: scaleY(-1) translateY(13px);
    }
  </style>
</head>

  <script>
    const defaultVars = {
      background: "black",
      gradientColor1: "#300835",
      gradientColor2: "rgb(16, 4, 41)",
      cardGradient1: "rgb(135, 139, 165)",
      cardGradient2: "rgb(104, 104, 121)",
      cardGradientHover1: "rgb(82, 84, 99)",
      cardGradientHover2: "rgb(53, 53, 61)",
      borderColor: "rgb(38, 7, 69)",
      textColor: "white",
      arrowColor: "gray",
      borderRadius: "16px",
      cardRadius1: "20px",
      cardRadius2: "10px",
    };

    const styledata = JSON.parse(
      localStorage.getItem("style-settings") ?? JSON.stringify(defaultVars),
    );

    const root = document.documentElement;

    root.style.setProperty("--background", styledata.background);
    root.style.setProperty("--gradient-color1", styledata.gradientColor1);
    root.style.setProperty("--gradient-color2", styledata.gradientColor2);
    root.style.setProperty("--card-gradient-color1", styledata.cardGradient1);
    root.style.setProperty("--card-gradient-color2", styledata.cardGradient2);
    root.style.setProperty(
      "--card-gradient-hover-color1",
      styledata.cardGradientHover1,
    );
    root.style.setProperty(
      "--card-gradient-hover-color2",
      styledata.cardGradientHover2,
    );
    root.style.setProperty("--border-color1", styledata.borderColor);
    root.style.setProperty("--text-color", styledata.textColor);
    root.style.setProperty("--arrow-color", styledata.arrowColor);
    root.style.setProperty("--border-radius-1", styledata.borderRadius);
    root.style.setProperty("--card-border-radius1", styledata.cardRadius1);
    root.style.setProperty("--card-border-radius2", styledata.cardRadius2);
  </script>

    function openGame(gameId, title) {
      const newWindow = window.open("about:blank", "_blank");
      fetch(gameId)
        .then((res) => res.text())
        .then((html) => {
          const doc = newWindow.document;
          doc.open();
          doc.write(`<title>${title}</title>`);
          doc.write(html);
          script = doc.createElement('script')
          script.innerHTML = `
          <style>
            h4 { position: absolute; color: gray; top: 10px; left: 10px; margin: 0; opacity: 50%; font-family: sans-serif; z-index: 999; pointer-events: none; }
          </style>
          
          <body>
            
            <h4>- to lock mouse</h4>
            <script>
              
              let test2 = document.querySelector('body');

              function pressListener(e) {
                  if (e.key === '-' || e.key === '\\\\') {
                      if (e.key === '\\\\') {
                          e.preventDefault();
                          e.stopPropagation();
                          window.open('calc.html', '_blank', 'noopener,noreferrer');
                      }
                      if (document.pointerLockElement) {
                          document.exitPointerLock();
                      } else {
                          document.body.requestPointerLock();
                      }
                  }
              }
              document.addEventListener('keydown', pressListener);
            <\/script>
          </body>`
          doc.body.appendChild(script)
          doc.close();
        });
    }

    const allGames = [
      gamesjson,
      onlinegamesjson,
      onlinegames2json,
      toolsjson,
    ];

    const FavoriteDiv = document.getElementById('body-div-0');
    let favorites = (JSON.parse(localStorage.getItem('favoriteGames')) || []).filter(fav => fav !== "");

    function removeFromFavorites(title) {
      favorites = favorites.filter(fav => fav !== title);
      localStorage.setItem('favoriteGames', JSON.stringify(favorites));

      Array.from(FavoriteDiv.children).forEach(child => {
        if (child.querySelector('p')?.textContent === title) {
          child.remove();
        }
      });
    }

    function addToFavorites(item) {
      if (favorites.includes(item.title)) return;

      favorites.push(item.title);
      localStorage.setItem('favoriteGames', JSON.stringify(favorites));

      const favCard = document.createElement("a");
      favCard.className = "game-card";
      favCard.style.cssText += "flex: 1 1 280px; height: 280px;";
      favCard.innerHTML = `<img style="border: solid 1px white; width: 100%; height: auto;" src="images/${item.image}"/><p>${item.title}</p>`;

      favCard.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        removeFromFavorites(item.title);
      });

      favCard.addEventListener('click', (e) => {
        openGameWindow(item, "games/" + item.link);
      });

      FavoriteDiv.appendChild(favCard);
    }

    function openGameWindow(item, link) {
      let newWin = window.open("about:blank", "_blank");
      let doc = newWin.document;
      doc.open();
      doc.write(
        `<title>${item.title}</title>
          <style>
            body { position: relative; background-color: #000; overflow: hidden; margin: 0; padding: 0; width: 100vw; height: 100vh; }
          </style>
          <body>
              <iframe allow="fullscreen" allowfullscreen="true" frameborder="0" height="100%" width="100%" src="${link}"></iframe>
              <script>
              
              let test2 = document.querySelector('body');

              function pressListener(e) {
                  if (e.key === '-' || e.key === '\\\\') {
                      if (e.key === '\\\\') {
                          e.preventDefault();
                          e.stopPropagation();
                          window.open('calc.html', '_blank', 'noopener,noreferrer');
                      }
                      if (document.pointerLockElement) {
                          document.exitPointerLock();
                      } else {
                          document.body.requestPointerLock();
                      }
                  }
              }
              document.addEventListener('keydown', pressListener);
            <\/script>
          </body>`,
      );
      doc.close();
    }

    allGames.forEach((itm, idx) => {
      const bodyDiv = document.querySelector(`.body-div-${idx + 1}`);
      const section = document.getElementById(`section-${idx + 1}`);

      itm.forEach((item, index) => {
        const gameCard = document.createElement("a");
        gameCard.className = "game-card";

        let link = item.link;

        if (bodyDiv == document.querySelector(".body-div-1") || bodyDiv == document.querySelector(".body-div-4")) {
          gameCard.style.cssText += "flex: 1 1 280px; height: 280px;";
          gameCard.innerHTML = `<img style="border: solid 1px white" src="images/${item.image}"/><p>${item.title}</p>`;
          link = "games/" + link;
        } else {
          if (idx == 1) {
            gameCard.style.cssText += "flex: 1 1 280px; height: 280px;";
            gameCard.innerHTML = `<img style="border: solid 1px white" src="images/${item.image}"/><p>${item.title}</p>`;
          } else {
            gameCard.innerHTML = `<p style='font-size: 35px;'>${item.title}</p>`;
          }
        }

        bodyDiv.appendChild(gameCard);

        if (favorites.includes(item.title)) {
          const favCard = document.createElement("a");
          favCard.className = "game-card";
          favCard.style.cssText += "flex: 1 1 280px; height: 280px;";
          favCard.innerHTML = `<img style="border: solid 1px white" src="images/${item.image}"/><p>${item.title}</p>`;

          favCard.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            removeFromFavorites(item.title);
          });

          favCard.addEventListener('click', (e) => {
            openGameWindow(item, idx === 0 || idx === 3 ? "games/" + item.link : item.link);
          });

          FavoriteDiv.appendChild(favCard);
        }

        gameCard.addEventListener("click", (e) => {
          if (idx == 2) { openGame(item.link, item.title) } else { openGameWindow(item, link); }
        });

        gameCard.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          if (!favorites.includes(item.title)) {
            addToFavorites(item);
          } else {
            removeFromFavorites(item.title);
          }
        });
      });

      section.addEventListener("click", (e) => {
        bodyDiv.classList.toggle("switched");
        section.classList.toggle("active");
      });
    });



    const searchlist = document.getElementById("searchlist");
    const searchBar = document.getElementById("searchbar");
    let otherGrids = document.getElementById("grids");

    let everygame = [
      ...document.getElementById("body-div-0").children,
      ...document.getElementById("body-div-1").children,
      ...document.getElementById("body-div-2").children,
      ...document.getElementById("body-div-3").children,
      ...document.getElementById("body-div-4").children,
    ];
    searchBar.addEventListener("input", (e) => {
      let search = e.target.value.toLowerCase();
      everygame.forEach((item) => {
        if (search.length === 0) {
          item.style.display = "inline-block";
          item.style.order = 0;
          return;
        }
        let name = item.querySelector("p").innerHTML;
        let likely = 0;
        search.split("").forEach((character) => {
          let charin = name.toLowerCase().includes(character);
          if (charin) {
            likely += 0.1;
          }
        });
        search.split(" ").forEach((character) => {
          if (character.length < 2) return;
          let charin = name.toLowerCase().includes(character);
          if (charin) {
            likely += 0.5;
          }
        });

        if (likely > 0.5) {
          item.style.display = "inline-block";
          item.style.order = 100 - likely * 100;
        } else {
          item.style.display = "none";
        }
      });
    });
